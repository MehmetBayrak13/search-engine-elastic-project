<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ürün Arama</title>
    <meta
      name="description"
      content="Yazım hatalarına toleranslı, çok alanlı Elasticsearch ürün araması — milyonlarca ürün içinde aradığını bul."
    />

    <!-- Open Graph (sosyal medya paylaşımlarında zengin kart görünümü için) --
         bu tek sayfalık bir arama uygulaması: kendi ürün/sonuç sayfaları yok
         (her ürün amazon.com'a dışarı link veriyor), bu yüzden SSR/SSG'ye
         gerek yok -- tek anlamlı, sabit URL anasayfa olduğu için statik
         meta etiketleri yeterli. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://mehmetbayrak.ai/" />
    <meta property="og:site_name" content="Ürün Arama" />
    <meta property="og:locale" content="tr_TR" />
    <meta property="og:title" content="Ürün Arama — Milyonlarca ürün içinde aradığını bul" />
    <meta
      property="og:description"
      content="Yazım hatalarına toleranslı, çok alanlı Elasticsearch ürün araması."
    />
    <meta property="og:image" content="https://mehmetbayrak.ai/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Ürün Arama — Milyonlarca ürün içinde aradığını bul" />
    <meta
      name="twitter:description"
      content="Yazım hatalarına toleranslı, çok alanlı Elasticsearch ürün araması."
    />
    <meta name="twitter:image" content="https://mehmetbayrak.ai/og-image.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
